{% extends "base.html" %}
{% block content %}
<div class="toolbar">
  <h1>Products</h1>
  <span class="select_container">
    <select class="product_sort_container" data-test="product_sort_container" onchange="sortItems(this.value)">
      <option value="az">Name (A to Z)</option>
      <option value="za">Name (Z to A)</option>
      <option value="lohi">Price (low to high)</option>
      <option value="hilo">Price (high to low)</option>
    </select>
  </span>
</div>
<div class="inventory_list" data-price-sort="{{ price_sort }}">
  {% for p in products %}
  <div class="inventory_item" data-test="inventory-item" data-name="{{ p.name }}" data-price="{{ p.price }}">
    <div class="inventory_item_img"><img src="/static/img/{{ p.slug }}.svg" alt="{{ p.name }}"></div>
    <div class="inventory_item_name" data-test="inventory-item-name">{{ p.name }}</div>
    <div class="inventory_item_desc">{{ p.description }}</div>
    <div class="inventory_item_price" data-test="inventory-item-price">{{ money(p.price) }}</div>
    {% if p.slug in in_cart %}
    <button class="btn" data-slug="{{ p.slug }}" data-test="remove-{{ p.slug }}" onclick="toggleCart(this)">Remove</button>
    {% else %}
    <button class="btn" data-slug="{{ p.slug }}" data-test="add-to-cart-{{ p.slug }}" onclick="toggleCart(this)">Add to cart</button>
    {% endif %}
  </div>
  {% endfor %}
</div>
{% endblock %}
{% block scripts %}<script src="/static/shop.js"></script>{% endblock %}
