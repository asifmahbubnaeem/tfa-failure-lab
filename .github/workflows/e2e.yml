name: e2e
run-name: ${{ inputs.case_id || github.event.head_commit.message || 'e2e' }}

# Runs the Lab Shop e2e suite. On push it runs clean (no faults) and must pass.
# Run it by hand ("Run workflow") to break things on purpose: `patches` applies code changes from
# scenarios/patches/, `faults` switches on intermittent problems (see shop/runtime.py).
# When tests fail, the failed ones are rerun once and that result is saved too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      faults:
        description: "Runtime switches, space separated, e.g. FLAKY_API_500_PCT=40"
        required: false
        default: ""
      unset_tax_rate:
        description: "Start the shop without TAX_RATE (environment failure)"
        type: boolean
        default: false
      break_database:
        description: "Point the shop at a database port that isn't there (environment failure)"
        type: boolean
        default: false
      patches:
        description: "Patches from scenarios/patches/ to apply, space separated, without .patch"
        required: false
        default: ""
      case_id:
        description: "Label for this run (used by scenarios/collect.py to find it)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: labshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d labshop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: ci
      E2E_SITE: labshop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply fault switches
        env:
          FAULTS: ${{ inputs.faults }}
          UNSET_TAX: ${{ inputs.unset_tax_rate }}
          BREAK_DB: ${{ inputs.break_database }}
        run: |
          set -euo pipefail
          for kv in $FAULTS; do
            if [[ ! "$kv" =~ ^FLAKY_[A-Z0-9_]+=[A-Za-z0-9,]+$ ]]; then
              echo "::error::Not a fault switch: $kv"; exit 1
            fi
            echo "$kv" >> "$GITHUB_ENV"
            echo "fault on: $kv"
          done
          if [ "${BREAK_DB:-false}" = "true" ]; then
            echo "DATABASE_URL=postgresql://lab:lab@localhost:5999/labshop" >> "$GITHUB_ENV"
            echo "fault on: database unreachable"
          else
            echo "DATABASE_URL=postgresql://lab:lab@localhost:5432/labshop" >> "$GITHUB_ENV"
          fi
          if [ "${UNSET_TAX:-false}" = "true" ]; then
            echo "fault on: TAX_RATE unset"
          else
            echo "TAX_RATE=0.08" >> "$GITHUB_ENV"
          fi

      - name: Apply patches
        env:
          PATCHES: ${{ inputs.patches }}
        run: |
          set -euo pipefail
          for name in $PATCHES; do
            if [[ ! "$name" =~ ^[a-z0-9-]+$ ]] || [ ! -f "scenarios/patches/$name.patch" ]; then
              echo "::error::No such patch: $name"; exit 1
            fi
            git apply "scenarios/patches/$name.patch"
            echo "applied $name"
          done
          # What changed in this run, like the diff of a commit, and the code as it was tested.
          # The runtime hooks are left out of the snapshot: they are lab machinery, not the app.
          mkdir -p extra/source
          git diff > extra/diff.patch
          cp -r suite/tests extra/source/tests
          cp -r shop extra/source/shop
          rm -rf extra/source/shop/runtime.py extra/source/shop/static/img
          find extra -name __pycache__ -prune -exec rm -rf {} +

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r shop/requirements.txt
          pip install ./suite
          python -m playwright install --with-deps chromium

      - name: Start Lab Shop
        run: |
          nohup python -m uvicorn shop.app:app --port 8000 > shop.log 2>&1 &
          # Wait for the login page, which works without the database, so an environment
          # fault (database down) reaches the tests instead of stopping the job here.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/; then
              curl -s http://127.0.0.1:8000/healthz || true; echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::Lab Shop did not start"; cat shop.log; exit 1

      - name: Run e2e suite
        id: e2e
        working-directory: suite
        run: python -m pytest --junitxml=reports/junit.xml

      - name: Rerun failed tests
        if: failure() && steps.e2e.outcome == 'failure'
        working-directory: suite
        run: python -m pytest --lf --junitxml=reports/rerun.xml || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            suite/reports/junit.xml
            suite/reports/rerun.xml
            extra/
            suite/reports/html/
            suite/reports/screenshots/
            shop.log
          if-no-files-found: ignore
